name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --version

      - name: Make build.sh executable
        run: chmod +x build.sh

      # Compile injected library (.so)
      - name: Build Library (Android arm64)
        run: |
          ./build.sh --platform android --target lib --build release --arch arm64

      # Compile standalone executable (optional, can be commented out as needed)
      - name: Build Executable (Android arm64)
        run: |
          ./build.sh --platform android --target exe --build release --arch arm64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileDumper-Android-arm64
          path: |
            **/*.so
            **/MobileDumper-7
          if-no-files-found: warn
